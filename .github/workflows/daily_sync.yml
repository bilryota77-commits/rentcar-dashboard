name: IMS Auto Sync Service

on:
  schedule:
    # 한국 시간(KST) 기준 매일 03:00, 12:00 실행 (UTC 기준 18:00, 03:00)
    - cron: '0 18,3 * * *'
  workflow_dispatch: # 수동 실행 버튼 제공

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright firebase-admin
        python -m playwright install --with-deps chromium

    - name: Run IMS Sync Script
      env:
        IMS_ID: ${{ secrets.IMS_ID }}
        IMS_PW: ${{ secrets.IMS_PW }}
        FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
      run: python sync_ims_to_firebase.py
